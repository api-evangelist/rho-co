    features:
      - name: Business Checking and Savings
        description: Operating accounts with high FDIC sweep insurance and zero ACH fees.
      - name: Treasury
        description: Yield-bearing cash management product for idle balances.
      - name: Corporate Cards
        description: Issue physical and virtual cards with cash back, spend controls, and real-time visibility.
      - name: Virtual Card API
        description: Programmatically issue virtual cards, set limits, and retrieve transaction data for embedded payment flows.
      - name: Bill Pay
        description: Zero-fee AP with AI invoice scanning, approval workflows, and direct payment from Rho balances.
      - name: Expense Management
        description: Capture receipts, code transactions, and eliminate manual expense reports.
      - name: Invoicing
        description: Send invoices and collect customer payments alongside banking and AP.
      - name: Vendor Onboarding API
        description: Embed secure payment and tax form collection into supplier portals and internal apps.
      - name: Open Banking Aggregation
        description: Pull real-time balances from external institutions for a consolidated liquidity view.
      - name: Automated Close
        description: Automate monthly book close with reconciliation across banking, cards, treasury, and AP.
    useCases:
      - name: Startup Banking
        description: Replace a traditional business bank account with operating, treasury, cards, and AP in a single platform.
      - name: Multi-Entity Finance Operations
        description: Manage cash, cards, and AP across multiple legal entities from one dashboard.
      - name: Embedded Vendor Onboarding
        description: Use the Vendor Onboarding API to collect payee details directly inside your own supplier portal.
      - name: Embedded Virtual Card Issuance
        description: Issue virtual cards through your own software for custom payment flows.
      - name: Accountant Workflows
        description: Give accounting firms a Partner Portal for managing client books across Rho accounts.
    integrations:
      - name: QuickBooks Online
      - name: NetSuite
      - name: Sage Intacct
      - name: Microsoft Dynamics 365 Business Central
      - name: Xero
      - name: Plaid
      - name: ACH
      - name: Wire
      - name: SAFE Note Generator
    authentication:
      - type: API Key
        description: API key authentication for partner and customer integrations, provisioned through Rho.
