apis:
  - aid: rho-co:rho-platform-api
    name: Rho Platform API
    description: Rho exposes APIs for partners and customers to embed Rho banking and payments capabilities, including a Virtual Card API for programmatically issuing cards and a Vendor Onboarding API for embedding payment and tax form collection in supplier portals. Rho also leverages open banking APIs to aggregate external accounts into a unified liquidity view. API details are typically provisioned through Rho's partnerships and customer success teams.
    humanURL: https://www.rho.co/
    tags:
      - Banking
      - Cards
      - Vendors
      - Onboarding
      - Open Banking
      - Treasury
    properties:
      - type: Website
        url: https://www.rho.co/
      - type: VirtualCardAPI
        url: https://moreinfo.rho.co/corporate-card-issuer-virtual-card-api-custom-payment-flows
      - type: VendorOnboardingAPI
        url: https://moreinfo.rho.co/solution-vendor-onboarding-api-custom-supplier-portals
